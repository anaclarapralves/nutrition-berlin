async function callClaude(apiKey, prompt, maxTok) {
  maxTok = maxTok || 2000;
  var resp = await fetch("https://flat-dream-21ab.anaclarapralves.workers.dev", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      apiKey: apiKey,
      model: "claude-sonnet-4-5",
      max_tokens: maxTok,
      messages: [{ role: "user", content: prompt }]
    })
  });
  var data = await resp.json();
  if (data.error) throw new Error(data.error.message);
  var block = data.content && data.content.find(function(b) { return b.type === "text"; });
  return block ? block.text : "";
}

function Spinner() {
  return React.createElement("div", {style:{textAlign:"center",padding:"48px 20px"}},

  );

function SetupScreen(props) {
  var onComplete = props.onComplete;
  var [step, setStep] = useState(0);
  var [apiKey, setApiKey] = useState(LS.get("nutri_key",""));
  var [answers, setAnswers] = useState(LS.get("nutri_setup",{}));
  var [qIdx, setQIdx] = useState(0);

  var q = SETUP_QS[qIdx];
  var ans = answers[q ? q.id : ""] || [];
  var hasAns = ans.length > 0;

  function toggle(opt) {
    var cur = answers[q.id] || [];
    var next;
    if (q.type === "single") {
      next = [opt];
    } else {
      next = cur.indexOf(opt) >= 0 ? cur.filter(function(x){return x!==opt;}) : cur.concat([opt]);
    }
    var updated = Object.assign({}, answers);
    updated[q.id] = next;
    setAnswers(updated);
    LS.set("nutri_setup", updated);
    if (q.type === "single") {
      setTimeout(function() {
        if (qIdx < SETUP_QS.length - 1) setQIdx(function(i){return i+1;});
      }, 280);
    }
  }

  function saveKey() {
    if (!apiKey.startsWith("sk-")) return;
    LS.set("nutri_key", apiKey);
    setStep(1);
  }

  function finish() {
    LS.set("nutri_key", apiKey);
    LS.set("nutri_setup", answers);
    onComplete(apiKey, answers);
  }

  var progress = ((qIdx+1)/SETUP_QS.length)*100;

  if (step === 0) {
    return React.createElement("div", {style:{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20,background:"var(--g1)"}},
      React.createElement("div", {style:{maxWidth:400,width:"100%"},className:"fadeup"},
        React.createElement("div", {className:"serif",style:{fontSize:30,color:"white",marginBottom:4,fontStyle:"italic"}}, "Nutri\u00e7\u00e3o"),
        React.createElement("div", {style:{fontSize:10,color:"rgba(255,255,255,0.45)",letterSpacing:2,marginBottom:28,textTransform:"uppercase"}}, "Berlim 2025 \u00b7 Ana Clara"),
        React.createElement("div", {className:"card",style:{padding:24}},
          React.createElement("p", {style:{fontSize:12,color:"var(--ink2)",lineHeight:1.7,marginBottom:20}},

  var setup = props.setup;
  var [ctx, setCtx] = useState(LS.get("nutri_ctx",""));
  var [loading, setLoading] = useState(false);

  async function gerar() {
    if (!apiKey) return;
    setLoading(true);
    try {
      var prompt = buildContextoPrompt(setup);
      var text = await callClaude(apiKey, prompt, 2000);
      setCtx(text);
      LS.set("nutri_ctx", text);
    } catch(e) { console.error(e); }
    setLoading(false);
  }

  return React.createElement("div", {className:"fadeup"},
    React.createElement("div", {style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:10}},
      React.createElement("div", {className:"serif",style:{fontSize:22}}, "Contexto Nutricional"),

    !loading && !ctx && React.createElement("div", {className:"card",style:{padding:36,textAlign:"center"}},
      React.createElement("div", {style:{fontSize:36,marginBottom:12}}, ""),
      React.createElement("div", {className:"serif",style:{fontSize:18,marginBottom:8}}, "Entenda seu plano"),
      React.createElement("p", {style:{fontSize:11,color:"var(--ink3)",lineHeight:1.7,maxWidth:320,margin:"0 auto 20px"}},
        "C\u00e1lculo de macros, timing, suplementa\u00e7\u00e3o e os porqu\u00eas cient\u00edficos por tr\u00e1s de cada recomenda\u00e7\u00e3o."

function BioTab(props) {

    {id:"massaGorda",label:"Massa Gorda",    unit:"kg",  ph:"10.3"},

  var [form, setForm] = useState(emptyForm);
  var [saving, setSaving] = useState(false);
  var [analise, setAnalise] = useState(LS.get("nutri_bio_analise",""));

  var [saved, setSaved] = useState(false);

  function setField(k, v) {
    setForm(function(f) { var n = Object.assign({}, f); n[k] = v; return n; });
  }

  function canSave() { return form.peso && form.data; }

  function salvar() {
    if (!canSave()) return;
    setSaving(true);
    var entry = {
      data: form.data,
      peso: parseFloat(form.peso) || null,
      gordura: parseFloat(form.gordura) || null,
      musculo: parseFloat(form.musculo) || null,
      agua: parseFloat(form.agua) || null,
      mlg: parseFloat(form.mlg) || null,
      massaGorda: parseFloat(form.massaGorda) || null,

    var updated = [entry].concat(bioHistorico);
    setBioHistorico(updated);
    LS.set("nutri_bio", updated);
    setForm(emptyForm);
    setSaved(true);
    onPlanInvalidated();
    setTimeout(function() { setSaved(false); }, 2500);

      "SUPLEMENTOS: Omega-3, Magnesio, CoQ10, Complexo B, Whey, Probiotico.\n" +

      "MEDICAO MAIS RECENTE:\n" +
      "Peso: " + (latest.peso||"?") + "kg | Gordura: " + (latest.gordura||"?") + "% | Musculo: " + (latest.musculo||"?") + "kg | Agua: " + (latest.agua||"?") + "kg | MLG: " + (latest.mlg||"?") + "kg\n\n" +
      "Responda em portugues com estas secoes:\n\n" +

      "Uma acao prioritaria para os proximos 30 dias.";

  var latest = bioHistorico[0];

    if (vals.length < 2) return null;

    var w = 80, h = 28, p = 3;
    var pts = vals.map(function(v, i) {
      return { x: p + (i/(vals.length-1))*(w-p*2), y: h-p-((v-mn)/(mx-mn))*(h-p*2) };

    var d = pts.map(function(pt,i){ return (i===0?"M":"L") + pt.x + "," + pt.y; }).join(" ");

      // Data e obs
      React.createElement("div", {style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}},
        React.createElement("div", null,
          React.createElement("div", {className:"label",style:{marginBottom:4}}, "Data (dd/mm)"),
          React.createElement("input", {className:"inp",value:form.data,onChange:function(e){setField("data",e.target.value);},placeholder:"23/05"})
        ),
        React.createElement("div", null,
          React.createElement("div", {className:"label",style:{marginBottom:4}}, "Peso (kg) *"),
          React.createElement("input", {className:"inp",type:"number",step:"0.1",value:form.peso,onChange:function(e){setField("peso",e.target.value);},placeholder:"59.1"})
        )
      ),

      // Campos de composi\u00e7\u00e3o
      React.createElement("div", {style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}},
        CAMPOS.filter(function(c){ return c.id !== "peso"; }).map(function(c) {
          return React.createElement("div", {key:c.id},
            React.createElement("div", {className:"label",style:{marginBottom:4}}, c.label + " (" + c.unit + ")"),
            React.createElement("input", {className:"inp",type:"number",step:"0.1",value:form[c.id],onChange:function(e){setField(c.id,e.target.value);},placeholder:c.ph})
          );
        })
      ),

      // Observa\u00e7\u00e3o
      React.createElement("div", {style:{marginBottom:14}},
        React.createElement("div", {className:"label",style:{marginBottom:4}}, "Observa\u00e7\u00e3o"),
        React.createElement("input", {className:"inp",value:form.obs,onChange:function(e){setField("obs",e.target.value);},placeholder:"Como voc\u00ea est\u00e1 se sentindo, contexto..."})
      ),

      React.createElement("button", {
        className:"btn btn-g",
        style:{width:"100%"},
        disabled:!canSave()||saving,
        onClick:salvar
      }, saved ? "ok Salvo! Plano ser\u00e1 recalculado." : "Salvar medi\u00e7\u00e3o")
    ),

    // HISTORICO + GRAFICOS
    bioHistorico.length > 0 && React.createElement("div", {className:"card",style:{padding:20,marginBottom:16}},
      React.createElement("div", {style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:8}},
        React.createElement("div", {className:"label",style:{color:"var(--g2)"}}, "Hist\u00f3rico de medi\u00e7\u00f5es"),
        React.createElement("div", {style:{fontSize:10,color:"var(--ink3)"}}, bioHistorico.length + " medi\u00e7\u00e3o" + (bioHistorico.length>1?"\u00f5es":""))
      ),

      // Sparklines dos indicadores principais
      bioHistorico.length >= 2 && React.createElement("div", {style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:16}},
        [
          {field:"peso",    label:"Peso",    unit:"kg", latest: latest && latest.peso},
          {field:"gordura", label:"Gordura", unit:"%",  latest: latest && latest.gordura},
          {field:"musculo", label:"M\u00fasculo", unit:"kg", latest: latest && latest.musculo},
        ].map(function(m) {
          return React.createElement("div", {key:m.field,style:{background:"var(--bg2)",borderRadius:8,padding:"10px 10px 8px"}},
            React.createElement("div", {className:"label",style:{fontSize:7,marginBottom:4}}, m.label),
            m.latest && React.createElement("div", {className:"serif",style:{fontSize:17,color:"var(--ink)",lineHeight:1,marginBottom:4}},
              m.latest + m.unit
            ),
            React.createElement(Spark, {field:m.field})
          );
        })
      ),

      // Tabela hist\u00f3rico
      React.createElement("div", {style:{overflowX:"auto"}},
        React.createElement("table", {style:{width:"100%",borderCollapse:"collapse",fontSize:10}},
          React.createElement("thead", null,
            React.createElement("tr", {style:{borderBottom:"1px solid var(--border)"}},
              ["Data","Peso","Gordura","M\u00fasculo","\u00c1gua",""].map(function(h,i) {
                return React.createElement("th", {key:i,style:{padding:"6px 8px",textAlign:"left",fontFamily:"DM Mono,monospace",fontSize:8,letterSpacing:1,color:"var(--ink3)",textTransform:"uppercase",fontWeight:400}}, h);
              })
            )
          ),
          React.createElement("tbody", null,
            bioHistorico.map(function(e, i) {
              return React.createElement("tr", {key:e.ts,style:{borderBottom:"1px solid var(--bg2)",background:i%2===0?"white":"var(--bg2)"}},
                React.createElement("td", {style:{padding:"7px 8px",color:"var(--ink3)",fontFamily:"DM Mono,monospace",whiteSpace:"nowrap"}}, e.data),
                React.createElement("td", {style:{padding:"7px 8px",fontFamily:"DM Mono,monospace",fontWeight:500}}, e.peso ? e.peso+"kg" : "\u2014"),
                React.createElement("td", {style:{padding:"7px 8px",fontFamily:"DM Mono,monospace",color:"var(--r2)"}}, e.gordura ? e.gordura+"%" : "\u2014"),
                React.createElement("td", {style:{padding:"7px 8px",fontFamily:"DM Mono,monospace",color:"var(--g2)"}}, e.musculo ? e.musculo+"kg" : "\u2014"),
                React.createElement("td", {style:{padding:"7px 8px",fontFamily:"DM Mono,monospace",color:"var(--b2)"}}, e.agua ? e.agua+"kg" : "\u2014"),
                React.createElement("td", {style:{padding:"7px 8px"}},
                  React.createElement("button", {onClick:function(){remover(e.ts);},style:{background:"none",border:"none",color:"var(--ink3)",fontSize:12,cursor:"pointer",padding:"0 4px"}}, "\u00d7")

    // AN\u00c1LISE IA

        React.createElement("div", null,
          React.createElement("div", {className:"serif",style:{fontSize:17}}, "An\u00e1lise IA"),
          React.createElement("div", {style:{fontSize:10,color:"var(--ink3)",marginTop:2}}, "Ajustes no plano com base na sua evolu\u00e7\u00e3o")

      !loadingAnalise && analise && React.createElement("div", {style:{fontFamily:"DM Mono,monospace",fontSize:11,lineHeight:1.9,color:"var(--ink2)",whiteSpace:"pre-wrap"}}, analise),
      !loadingAnalise && !analise && React.createElement("div", {style:{fontSize:11,color:"var(--ink3)",fontStyle:"italic",marginTop:8}},

      React.createElement("div", {style:{fontSize:11}}, "Nenhuma medi\u00e7\u00e3o registrada ainda. Adicione sua primeira acima.")
    )
  );
}

function DiarioTab(props) {

  var diario = props.diario;
  var setDiario = props.setDiario;
  var onInsight = props.onInsight;

  var hoje = new Date().toLocaleDateString("pt-BR", {day:"2-digit",month:"2-digit",year:"2-digit"});

  var [tipoDia, setTipodia] = useState("geral");

  var [loadingInsight, setLoadingInsight] = useState(false);

  var TIPOS_DIA = [

    if (!texto.trim()) return;

    React.createElement("p", {style:{fontSize:11,color:"var(--ink3)",lineHeight:1.6,marginBottom:20}},
      "Anote o que funcionou, o que n\u00e3o funcionou, como se sentiu. A IA usa suas anota\u00e7\u00f5es para refinar o plano."
    ),

    React.createElement("div", {className:"card",style:{padding:20,marginBottom:16}},
      React.createElement("div", {className:"label",style:{marginBottom:10,color:"var(--g2)"}}, "Nova anota\u00e7\u00e3o"),

          return React.createElement("button", {key:t.id,onClick:function(){setTipodia(t.id);},style:{padding:"5px 12px",borderRadius:20,border:"1.5px solid "+(tipodia===t.id?"var(--g2)":"var(--border)"),background:tipodia===t.id?"var(--g2)":"white",color:tipodia===t.id?"white":"var(--ink2)",fontFamily:"DM Mono,monospace",fontSize:9,cursor:"pointer"}}, t.label);

        style:{width:"100%",minHeight:100,padding:"10px 12px",border:"1px solid var(--border)",borderRadius:8,fontSize:12,fontFamily:"DM Mono,monospace",color:"var(--ink)",resize:"vertical",outline:"none",lineHeight:1.6,marginBottom:12}
      }),

        className:"btn btn-g",style:{width:"100%"},

}

function App() {
  var [apiKey, setApiKey] = useState(LS.get("nutri_key",""));
  var [setup, setSetup] = useState(LS.get("nutri_setup",{}));
  var [ready, setReady] = useState(function() {
    return !!LS.get("nutri_key","") && Object.keys(LS.get("nutri_setup",{})).length >= SETUP_QS.length;
  });
  var [tab, setTab] = useState("hoje");
  var [planos, setPlanos] = useState(LS.get("nutri_planos",{}));
  var [bioHistorico, setBioHistorico] = useState(LS.get("nutri_bio",[]));
  var [diario, setDiario] = useState(LS.get("nutri_diario",[]));
  var [planoInvalidado, setPlanoInvalidado] = useState(false);

  var TABS = [
    {id:"hoje",    label:"Hoje",     icon:""},
    {id:"bio",     label:"Bio",      icon:""},
    {id:"diario",  label:"Diario",   icon:""},
    {id:"geis",    label:"Geis",     icon:""},
    {id:"contexto",label:"Contexto", icon:""},
    {id:"perfil",  label:"Perfil",   icon:""},
  ];

  function handleComplete(key, ans) {
    setApiKey(key); setSetup(ans); setReady(true);
  }

  function handleReset() {
    LS.set("nutri_setup",{}); LS.set("nutri_planos",{}); LS.set("nutri_geis",null); LS.set("nutri_ctx","");
    setSetup({}); setPlanos({}); setReady(false);
  }

  function handlePlanInvalidated() {
    // Clear cached plans so they regenerate with new bio data
    setPlanos({});
    LS.set("nutri_planos",{});
    LS.set("nutri_bio_analise","");
    setPlanoInvalidado(true);
    setTimeout(function(){ setPlanoInvalidado(false); }, 4000);
  }

  if (!ready) return React.createElement(SetupScreen, {onComplete:handleComplete});

  return React.createElement("div", {style:{background:"var(--bg)",minHeight:"100vh",paddingBottom:68}},
    React.createElement("div", {style:{background:"var(--g1)",color:"white",padding:"18px 16px 0",position:"sticky",top:0,zIndex:100}},
      React.createElement("div", {style:{maxWidth:660,margin:"0 auto"}},
        React.createElement("div", {style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}},
          React.createElement("div", null,
            React.createElement("div", {style:{fontSize:8,letterSpacing:3,textTransform:"uppercase",color:"rgba(255,255,255,0.4)",marginBottom:3}}, "Nutri\u00e7\u00e3o \u00b7 Berlim 2025"),
            React.createElement("div", {className:"serif",style:{fontSize:"clamp(17px,4vw,22px)",color:"white",fontStyle:"italic",lineHeight:1}}, "Ana Clara")
          ),
          React.createElement("div", {style:{textAlign:"right",fontSize:9,color:"rgba(255,255,255,0.4)"}},
            React.createElement("div", null, (bioHistorico[0] ? bioHistorico[0].peso+"kg" : "59,1 kg") + " \u00b7 " + (bioHistorico[0] && bioHistorico[0].gordura ? bioHistorico[0].gordura+"% gord" : "17,5% gord")),
            React.createElement("div", {style:{marginTop:2}}, "Sub-4h \u00b7 set/2025")
          )
        ),
        React.createElement("div", {style:{display:"flex",gap:0,overflowX:"auto",marginTop:10}},
          TABS.map(function(t) {
            return React.createElement("button", {key:t.id,onClick:function(){setTab(t.id);},style:{padding:"8px 14px",background:tab===t.id?"var(--bg)":"transparent",color:tab===t.id?"var(--g1)":"rgba(255,255,255,0.55)",border:"none",borderRadius:"7px 7px 0 0",fontFamily:"DM Mono,monospace",fontSize:9,letterSpacing:1,textTransform:"uppercase",cursor:"pointer",whiteSpace:"nowrap",transition:"all 0.15s",display:"flex",alignItems:"center",gap:5}},
              React.createElement("span", null, t.label)
            );
          })
        )
      )
    ),
    React.createElement("div", {style:{maxWidth:660,margin:"0 auto",padding:"20px 16px 32px"}},
      planoInvalidado && React.createElement("div", {style:{background:"var(--a3)",border:"1px solid var(--a2)",borderRadius:8,padding:"10px 14px",marginBottom:16,fontSize:11,color:"var(--a1)",display:"flex",alignItems:"center",gap:8}},
        React.createElement("span", null, "[aviso]"),
        React.createElement("span", null, "Nova medi\u00e7\u00e3o salva. Os planos do dia ser\u00e3o regenerados com seus dados atualizados.")
      ),
      tab==="hoje"     && React.createElement(TodayTab,    {apiKey:apiKey,setup:setup,planos:planos,setPlanos:setPlanos,bioLatest:bioHistorico[0]||null}),
      tab==="bio"      && React.createElement(BioTab,      {apiKey:apiKey,bioHistorico:bioHistorico,setBioHistorico:setBioHistorico,onPlanInvalidated:handlePlanInvalidated}),
      tab==="diario"   && React.createElement(DiarioTab,   {apiKey:apiKey,diario:diario,setDiario:setDiario}),
      tab==="geis"     && React.createElement(GeisTab,     {apiKey:apiKey,setup:setup}),
      tab==="contexto" && React.createElement(ContextoTab, {apiKey:apiKey,setup:setup}),
      tab==="perfil"   && React.createElement(PerfilTab,   {setup:setup,onReset:handleReset})
    ),
    React.createElement("div", {style:{position:"fixed",bottom:0,left:0,right:0,background:"var(--g1)",borderTop:"1px solid rgba(255,255,255,0.08)",display:"flex",zIndex:200}},
      TABS.map(function(t) {
        return React.createElement("button", {key:t.id,onClick:function(){setTab(t.id);},style:{flex:1,padding:"10px 4px 12px",background:"transparent",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3,color:tab===t.id?"white":"rgba(255,255,255,0.35)",transition:"color 0.15s"}},
                    React.createElement("span", {style:{fontFamily:"DM Mono,monospace",fontSize:7,letterSpacing:0.5,textTransform:"uppercase"}}, t.label),
          tab===t.id && React.createElement("div", {style:{width:4,height:4,background:"var(--g4)",borderRadius:"50%"}})
        );
      })
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
