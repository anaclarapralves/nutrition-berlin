// API call via proxy
async function callClaude(apiKey, prompt, maxTok) {
  maxTok = maxTok || 2000;
  const resp = await fetch(PROXY, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      apiKey: apiKey,
      max_tokens: maxTok,
      messages: [{role: "user", content: prompt}]
    })
  });
  const data = await resp.json();
  if (data.error) throw new Error(data.error.message);
  const block = data.content && data.content.find(b => b.type === "text");
  return block ? block.text : "";
}

function SetupScreen({onComplete}) {
  const [step, setStep] = useState(0);
  const [apiKey, setApiKey] = useState(LS.get("nutri_key",""));
  const [answers, setAnswers] = useState(LS.get("nutri_setup",{}));
  const [qIdx, setQIdx] = useState(0);

  const q = SETUP_QS[qIdx];
  const ans = answers[q ? q.id : ""] || [];
  const hasAns = ans.length > 0;
  const progress = ((qIdx+1)/SETUP_QS.length)*100;

  function toggle(opt) {
    const cur = answers[q.id] || [];
    const next = q.type === "single" ? [opt] : (cur.includes(opt) ? cur.filter(x=>x!==opt) : [...cur,opt]);
    const updated = {...answers, [q.id]: next};
    setAnswers(updated);
    LS.set("nutri_setup", updated);
    if (q.type === "single" && qIdx < SETUP_QS.length-1) setTimeout(()=>setQIdx(i=>i+1), 280);
  }

  function saveKey() {
    if (!apiKey.startsWith("sk-")) return;
    LS.set("nutri_key", apiKey);
    setStep(1);
  }

  function finish() {
    LS.set("nutri_key", apiKey);
    LS.set("nutri_setup", answers);
    onComplete(apiKey, answers);
  }

  if (step === 0) return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20,background:"var(--g1)"}}>
      <div style={{maxWidth:400,width:"100%"}}>

    <div style={{minHeight:"100vh",background:"var(--bg)",padding:"28px 16px"}}>

  );
}

      <div style={{flex:1,paddingBottom:12}}>

          <div onClick={()=>setOpen(!open)} style={{padding:"12px 14px",cursor:"pointer",display:"flex",alignItems:"center",gap:10}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:"flex",alignItems:"baseline",gap:8,flexWrap:"wrap"}}>
                <div className="serif" style={{fontSize:15,color:"var(--ink)"}}>{meal.nome}</div>
                <div className="label" style={{fontSize:8}}>{meal.horario}</div>

              {!open && opt && opt.itens &&

          </div>
          {open && (
            <div style={{borderTop:"1px solid var(--bg2)",padding:14}}>
              {meal.calorias && (
                <div style={{display:"flex",justifyContent:"space-around",background:"var(--bg2)",borderRadius:8,padding:"10px 0",marginBottom:14}}>

// \u2500\u2500 TODAY TAB \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500

function TodayTab({apiKey, setup, planos, setPlanos, bioLatest}) {
  const [tipoId, setTipoId] = useState(LS.get("nutri_tipo","descanso"));
  const [horId, setHorId] = useState(LS.get("nutri_hor","manha"));
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");

  const tipo = TIPOS.find(t=>t.id===tipoId) || TIPOS[0];
  const hor  = HORARIOS.find(h=>h.id===horId) || HORARIOS[0];
  const key  = tipoId+"_"+horId;
  const plano = planos[key];

  async function gerar() {
    setLoading(true); setErr("");
    try {
      const text = await callClaude(apiKey, buildPlanoPrompt(tipo, hor, setup, bioLatest), 2500);
      const clean = text.trim().replace(/^```json\s*/i,"").replace(/^```\s*/,"").replace(/\s*```$/,"");
      const parsed = JSON.parse(clean);
      const updated = {...planos, [key]: parsed};
      setPlanos(updated);
      LS.set("nutri_planos", updated);
    } catch(e) { setErr("Erro: "+e.message); }
    setLoading(false);
  }

  return (
    <div className="fadeup">
      <div style={{marginBottom:18}}>
        <div className="label" style={{marginBottom:10}}>Tipo de treino hoje</div>
        <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
          {TIPOS.map(t => (
            <button key={t.id} onClick={()=>{setTipoId(t.id);LS.set("nutri_tipo",t.id);}} style={{padding:"8px 13px",borderRadius:22,border:"2px solid "+(tipoId===t.id?t.cor:"var(--border)"),background:tipoId===t.id?t.bg:"#fff",color:tipoId===t.id?t.cor:"var(--ink2)",fontFamily:"DM Mono,monospace",fontSize:10,cursor:"pointer"}}>
              {t.label}
            </button>
          ))}
        </div>
      </div>
      {tipoId !== "descanso" && (
        <div style={{marginBottom:18}}>
          <div className="label" style={{marginBottom:10}}>Horario do treino</div>
          <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
            {HORARIOS.map(h => (
              <button key={h.id} onClick={()=>{setHorId(h.id);LS.set("nutri_hor",h.id);}} style={{padding:"7px 12px",borderRadius:20,border:"1.5px solid "+(horId===h.id?"var(--g2)":"var(--border)"),background:horId===h.id?"var(--g2)":"#fff",color:horId===h.id?"#fff":"var(--ink2)",fontFamily:"DM Mono,monospace",fontSize:10,cursor:"pointer"}}>
                <div>{h.label}</div>
                <div style={{fontSize:8,opacity:.7,marginTop:1}}>{h.sub}</div>
              </button>
            ))}
          </div>
        </div>
      )}
      {!plano && !loading && (
        <div className="card" style={{padding:32,textAlign:"center",marginBottom:16}}>
          <div className="serif" style={{fontSize:18,marginBottom:8}}>{tipo.label}{tipoId!=="descanso"?" - "+hor.label:""}</div>
          <p style={{fontSize:11,color:"var(--ink3)",lineHeight:1.7,marginBottom:20}}>A IA monta seu plano cronologico do dia com quantidades exatas para cada refeicao.</p>
          <button className="btn btn-g" onClick={gerar} disabled={!apiKey}>Gerar plano do dia</button>
        </div>
      )}
      {loading && <Spinner msg={"Montando plano para "+tipo.label+"..."}/>}
      <ErrBox msg={err}/>
      {plano && !loading && (
        <div>
          <div className="card" style={{padding:"14px 18px",marginBottom:14,display:"flex",justifyContent:"space-around",borderLeft:"4px solid "+(tipo.cor||"var(--g2)")}}>
            {[{l:"Calorias",v:plano.calorias_total,u:"kcal",c:"var(--ink2)"},{l:"Proteina",v:plano.proteina_total,u:"g",c:"var(--r2)"},{l:"Carb",v:plano.carbo_total,u:"g",c:"var(--a2)"},{l:"Gordura",v:plano.gordura_total,u:"g",c:"var(--g3)"}].map((m,i) => (
              <div key={m.l} style={{textAlign:"center",flex:1,borderRight:i<3?"1px solid var(--border)":"none",padding:"0 6px"}}>
                <div className="serif" style={{fontSize:20,color:m.c,lineHeight:1}}>{m.v}</div>
                <div className="label" style={{fontSize:7,marginTop:2}}>{m.l}</div>
                <div style={{fontSize:9,color:"var(--ink3)"}}>{m.u}</div>
              </div>
            ))}
          </div>
          {plano.refeicoes && plano.refeicoes.map((meal,i) => <MealCard key={meal.id||i} meal={meal}/>)}
          <button className="btn btn-o" style={{width:"100%",marginTop:8}} onClick={gerar} disabled={loading}>Regenerar plano</button>
        </div>
      )}
    </div>
  );
}

// \u2500\u2500 CONTEXTO TAB \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500

function ContextoTab({apiKey, setup}) {
  const [ctx, setCtx] = useState(LS.get("nutri_ctx",""));
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");

  async function gerar() {
    setLoading(true); setErr("");
    try {
      const text = await callClaude(apiKey, buildContextoPrompt(setup), 2000);
      setCtx(text);
      LS.set("nutri_ctx", text);
    } catch(e) { setErr("Erro: "+e.message); }
    setLoading(false);
  }

  return (
    <div className="fadeup">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:10}}>
        <div className="serif" style={{fontSize:22}}>Contexto Nutricional</div>
        <button className="btn btn-g" disabled={loading||!apiKey} onClick={gerar} style={{fontSize:9}}>{loading?"Gerando...":ctx?"Atualizar":"Gerar contexto"}</button>
      </div>
      {loading && <Spinner msg="Calculando seu plano nutricional..."/>}
      <ErrBox msg={err}/>
      {!loading && !ctx && (
        <div className="card" style={{padding:36,textAlign:"center"}}>
          <div className="serif" style={{fontSize:18,marginBottom:8}}>Entenda seu plano</div>
          <p style={{fontSize:11,color:"var(--ink3)",lineHeight:1.7,maxWidth:320,margin:"0 auto 20px"}}>Calculo de macros, timing, suplementacao e os porques por tras de cada recomendacao.</p>
          <button className="btn btn-g" disabled={!apiKey} onClick={gerar}>Gerar contexto</button>
        </div>
      )}
      {!loading && ctx && (
        <div className="card" style={{padding:24}}>
          <div style={{fontFamily:"DM Mono,monospace",fontSize:11,lineHeight:1.9,color:"var(--ink2)",whiteSpace:"pre-wrap"}}>{ctx}</div>
        </div>
      )}
    </div>
  );
}

// \u2500\u2500 BIO TAB \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500

function BioTab({apiKey, historico, setHistorico, onInvalidate}) {
  const hoje = new Date().toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});
  const empty = {data:hoje,peso:"",gordura:"",musculo:"",agua:"",mlg:"",massaGorda:"",obs:""};
  const [form, setForm] = useState(empty);
  const [analise, setAnalise] = useState(LS.get("nutri_bio_analise",""));
  const [loading, setLoading] = useState(false);
  const [saved, setSaved] = useState(false);

  function sf(k,v) { setForm(f=>({...f,[k]:v})); }
  function canSave() { return form.peso && form.data; }

  function salvar() {
    const entry = {data:form.data,peso:parseFloat(form.peso)||null,gordura:parseFloat(form.gordura)||null,musculo:parseFloat(form.musculo)||null,agua:parseFloat(form.agua)||null,mlg:parseFloat(form.mlg)||null,massaGorda:parseFloat(form.massaGorda)||null,obs:form.obs,ts:Date.now()};
    const updated = [entry,...historico];
    setHistorico(updated);
    LS.set("nutri_bio",updated);
    setForm(empty);
    setSaved(true);
    onInvalidate();
    setTimeout(()=>setSaved(false),2500);
  }

  async function gerarAnalise() {
    setLoading(true);
    try {
      const text = await callClaude(apiKey, buildBioPrompt(historico), 1500);
      setAnalise(text);
      LS.set("nutri_bio_analise",text);
    } catch(e) {}
    setLoading(false);
  }

  function Spark({field}) {
    const vals = historico.slice(0,8).map(e=>e[field]).filter(v=>v!=null).reverse();
    if (vals.length < 2) return null;
    const mn=Math.min(...vals)*.98, mx=Math.max(...vals)*1.02;
    const w=80,h=28,p=3;
    const pts = vals.map((v,i)=>({x:p+(i/(vals.length-1))*(w-p*2),y:h-p-((v-mn)/(mx-mn))*(h-p*2)}));
    const d = pts.map((pt,i)=>(i===0?"M":"L")+pt.x+","+pt.y).join(" ");
    const delta = vals[vals.length-1]-vals[0];
    const color = (delta>0)===(field==="musculo") ? "var(--g3)" : "var(--r2)";
    return (
      <div style={{display:"flex",alignItems:"center",gap:6}}>
        <svg width={w} height={h} style={{overflow:"visible"}}>
          <path d={d} fill="none" stroke={color} strokeWidth="1.5" strokeLinejoin="round"/>
        </svg>
        <div style={{fontSize:9,color,fontFamily:"DM Mono,monospace"}}>{(delta>0?"+":"")+delta.toFixed(1)}</div>
      </div>
    );
  }

  const campos = [
    {id:"gordura",label:"% Gordura",unit:"%",ph:"17.5"},{id:"musculo",label:"Musculo",unit:"kg",ph:"26.4"},
    {id:"agua",label:"Agua",unit:"kg",ph:"34.7"},{id:"mlg",label:"MLG",unit:"kg",ph:"48.8"},
    {id:"massaGorda",label:"Massa Gorda",unit:"kg",ph:"10.3"},
  ];

  return (
    <div className="fadeup">
      <div className="serif" style={{fontSize:22,marginBottom:6}}>Bioimpedancia</div>
      <p style={{fontSize:11,color:"var(--ink3)",lineHeight:1.6,marginBottom:20}}>Registre suas medicoes para que o plano se ajuste automaticamente.</p>

      <div className="card" style={{padding:20,marginBottom:16}}>
        <div className="label" style={{marginBottom:14,color:"var(--g2)"}}>Nova medicao</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
          <div>
            <div className="label" style={{marginBottom:4}}>Data (dd/mm)</div>
            <input className="inp" value={form.data} onChange={e=>sf("data",e.target.value)} placeholder="23/05"/>
          </div>
          <div>
            <div className="label" style={{marginBottom:4}}>Peso (kg) *</div>
            <input className="inp" type="number" step="0.1" value={form.peso} onChange={e=>sf("peso",e.target.value)} placeholder="59.1"/>
          </div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
          {campos.map(c => (
            <div key={c.id}>
              <div className="label" style={{marginBottom:4}}>{c.label} ({c.unit})</div>
              <input className="inp" type="number" step="0.1" value={form[c.id]} onChange={e=>sf(c.id,e.target.value)} placeholder={c.ph}/>
            </div>
          ))}
        </div>
        <div style={{marginBottom:14}}>
          <div className="label" style={{marginBottom:4}}>Observacao</div>
          <input className="inp" value={form.obs} onChange={e=>sf("obs",e.target.value)} placeholder="Como voce esta se sentindo..."/>
        </div>
        <button className="btn btn-g" style={{width:"100%"}} disabled={!canSave()} onClick={salvar}>
          {saved ? "Salvo! Plano sera recalculado." : "Salvar medicao"}
        </button>
      </div>

      {historico.length >= 2 && (
        <div className="card" style={{padding:20,marginBottom:16}}>
          <div className="label" style={{marginBottom:12,color:"var(--g2)"}}>Evolucao</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:16}}>
            {[{f:"peso",l:"Peso",u:"kg"},{f:"gordura",l:"Gordura",u:"%"},{f:"musculo",l:"Musculo",u:"kg"}].map(m => {
              const lat = historico[0] && historico[0][m.f];
              return (
                <div key={m.f} style={{background:"var(--bg2)",borderRadius:8,padding:"10px 10px 8px"}}>
                  <div className="label" style={{fontSize:7,marginBottom:4}}>{m.l}</div>
                  {lat && <div className="serif" style={{fontSize:17,color:"var(--ink)",lineHeight:1,marginBottom:4}}>{lat}{m.u}</div>}
                  <Spark field={m.f}/>
                </div>
              );
            })}
          </div>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:10}}>
              <thead>
                <tr style={{borderBottom:"1px solid var(--border)"}}>
                  {["Data","Peso","Gordura","Musculo","Agua",""].map((h,i) => (
                    <th key={i} style={{padding:"6px 8px",textAlign:"left",fontFamily:"DM Mono,monospace",fontSize:8,letterSpacing:1,color:"var(--ink3)",textTransform:"uppercase",fontWeight:400}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {historico.map((e,i) => (
                  <tr key={e.ts} style={{borderBottom:"1px solid var(--bg2)",background:i%2===0?"#fff":"var(--bg2)"}}>
                    <td style={{padding:"7px 8px",color:"var(--ink3)",fontFamily:"DM Mono,monospace",whiteSpace:"nowrap"}}>{e.data}</td>
                    <td style={{padding:"7px 8px",fontFamily:"DM Mono,monospace",fontWeight:500}}>{e.peso?""+e.peso+"kg":"-"}</td>
                    <td style={{padding:"7px 8px",fontFamily:"DM Mono,monospace",color:"var(--r2)"}}>{e.gordura?""+e.gordura+"%":"-"}</td>
                    <td style={{padding:"7px 8px",fontFamily:"DM Mono,monospace",color:"var(--g2)"}}>{e.musculo?""+e.musculo+"kg":"-"}</td>
                    <td style={{padding:"7px 8px",fontFamily:"DM Mono,monospace",color:"var(--b2)"}}>{e.agua?""+e.agua+"kg":"-"}</td>
                    <td style={{padding:"7px 8px"}}><button onClick={()=>{const u=historico.filter(x=>x.ts!==e.ts);setHistorico(u);LS.set("nutri_bio",u);}} style={{background:"none",border:"none",color:"var(--ink3)",fontSize:12,cursor:"pointer"}}>x</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {historico.length > 0 && (
        <div className="card" style={{padding:20,marginBottom:16}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:analise?14:0,flexWrap:"wrap",gap:8}}>
            <div>
              <div className="serif" style={{fontSize:17}}>Analise IA</div>
              <div style={{fontSize:10,color:"var(--ink3)",marginTop:2}}>Ajustes no plano com base na sua evolucao</div>
            </div>
            <button className="btn btn-g" disabled={loading||!apiKey} onClick={gerarAnalise} style={{fontSize:9}}>{loading?"Analisando...":analise?"Atualizar":"Analisar evolucao"}</button>
          </div>
          {loading && <Spinner msg="Analisando composicao corporal..."/>}
          {!loading && analise && <div style={{fontFamily:"DM Mono,monospace",fontSize:11,lineHeight:1.9,color:"var(--ink2)",whiteSpace:"pre-wrap"}}>{analise}</div>}
          {!loading && !analise && <div style={{fontSize:11,color:"var(--ink3)",fontStyle:"italic",marginTop:8}}>Clique em Analisar para receber recomendacoes personalizadas.</div>}
        </div>
      )}

      {historico.length === 0 && <div style={{textAlign:"center",padding:"32px 20px",color:"var(--ink3)",fontSize:11}}>Nenhuma medicao registrada ainda.</div>}
    </div>
  );
}

// \u2500\u2500 DIARIO TAB \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500

function DiarioTab({apiKey, diario, setDiario}) {
  const hoje = new Date().toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit"});
  const [texto, setTexto] = useState("");
  const [tipo, setTipo] = useState("geral");
  const [insight, setInsight] = useState(LS.get("nutri_diario_insight",""));
  const [loading, setLoading] = useState(false);
  const [saved, setSaved] = useState(false);

  const TIPOS_DIA = ["geral","treino","nutricao","gel","energia"];
  const CORES = {geral:"var(--ink3)",treino:"var(--g2)",nutricao:"var(--a2)",gel:"var(--b2)",energia:"var(--r2)"};

  function salvar() {
    if (!texto.trim()) return;
    const entry = {id:Date.now(),data:hoje,tipo,texto:texto.trim()};
    const updated = [entry,...diario];
    setDiario(updated);
    LS.set("nutri_diario",updated);
    setTexto("");
    setSaved(true);
    setTimeout(()=>setSaved(false),2000);
  }

  async function gerar() {
    setLoading(true);
    try {
      const text = await callClaude(apiKey, buildDiarioPrompt(diario), 1200);
      setInsight(text);
      LS.set("nutri_diario_insight",text);
    } catch(e) {}
    setLoading(false);
  }

  return (
    <div className="fadeup">
      <div className="serif" style={{fontSize:22,marginBottom:6}}>Diario</div>
      <p style={{fontSize:11,color:"var(--ink3)",lineHeight:1.6,marginBottom:20}}>Anote o que funcionou ou nao. A IA usa suas anotacoes para refinar o plano.</p>

      <div className="card" style={{padding:20,marginBottom:16}}>
        <div className="label" style={{marginBottom:10,color:"var(--g2)"}}>Nova anotacao</div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>
          {TIPOS_DIA.map(t => (
            <button key={t} onClick={()=>setTipo(t)} style={{padding:"5px 12px",borderRadius:20,border:"1.5px solid "+(tipo===t?"var(--g2)":"var(--border)"),background:tipo===t?"var(--g2)":"#fff",color:tipo===t?"#fff":"var(--ink2)",fontFamily:"DM Mono,monospace",fontSize:9,cursor:"pointer"}}>{t}</button>
          ))}
        </div>
        <textarea value={texto} onChange={e=>setTexto(e.target.value)} placeholder="Ex: Senti enjoo com o gel GU no treino. Whey com leite funcionou bem no pos-treino..." style={{width:"100%",minHeight:90,padding:"10px 12px",border:"1px solid var(--border)",borderRadius:8,fontSize:12,fontFamily:"DM Mono,monospace",color:"var(--ink)",resize:"vertical",outline:"none",lineHeight:1.6,marginBottom:12}}/>
        <button className="btn btn-g" style={{width:"100%"}} disabled={!texto.trim()} onClick={salvar}>{saved?"Salvo!":"Salvar anotacao"}</button>
      </div>

      {diario.length > 0 && (
        <div className="card" style={{padding:20,marginBottom:16}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:insight?14:0,flexWrap:"wrap",gap:8}}>
            <div className="serif" style={{fontSize:17}}>Insights IA</div>
            <button className="btn btn-g" disabled={loading||!apiKey} onClick={gerar} style={{fontSize:9}}>{loading?"Analisando...":insight?"Atualizar":"Gerar insights"}</button>
          </div>
          {loading && <Spinner msg="Analisando anotacoes..."/>}
          {!loading && insight && <div style={{fontFamily:"DM Mono,monospace",fontSize:11,lineHeight:1.9,color:"var(--ink2)",whiteSpace:"pre-wrap"}}>{insight}</div>}
          {!loading && !insight && <div style={{fontSize:11,color:"var(--ink3)",fontStyle:"italic",marginTop:8}}>Adicione anotacoes e clique em Gerar insights.</div>}
        </div>
      )}

      {diario.length > 0 && (
        <div className="card" style={{padding:20}}>
          <div className="label" style={{marginBottom:14,color:"var(--g2)"}}>Historico - {diario.length} anotacoes</div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {diario.map(e => (
              <div key={e.id} style={{padding:"10px 12px",background:"var(--bg2)",borderRadius:8,borderLeft:"3px solid "+(CORES[e.tipo]||"var(--border)")}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5}}>
                  <div style={{display:"flex",gap:8,alignItems:"center"}}>
                    <span style={{fontFamily:"DM Mono,monospace",fontSize:9,color:"var(--ink3)"}}>{e.data}</span>
                    <span style={{background:CORES[e.tipo]||"var(--border)",color:"#fff",padding:"1px 7px",borderRadius:10,fontSize:8,fontFamily:"DM Mono,monospace"}}>{e.tipo}</span>
                  </div>
                  <button onClick={()=>{const u=diario.filter(x=>x.id!==e.id);setDiario(u);LS.set("nutri_diario",u);}} style={{background:"none",border:"none",color:"var(--ink3)",fontSize:12,cursor:"pointer",padding:"0 4px"}}>x</button>
                </div>
                <div style={{fontSize:11,color:"var(--ink2)",lineHeight:1.6}}>{e.texto}</div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// \u2500\u2500 PERFIL TAB \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500

function PerfilTab({setup, onReset}) {
  return (

      <div className="serif" style={{fontSize:22,marginBottom:20}}>Meu Perfil</div>
      <div className="card" style={{padding:20,marginBottom:14}}>
        <div className="label" style={{marginBottom:12,color:"var(--g2)"}}>Dados Corporais - Mar/2026</div>

            <div key={m.l} style={{background:"var(--g5)",borderRadius:8,padding:"10px 12px",textAlign:"center"}}>
              <div className="label" style={{fontSize:7,marginBottom:3}}>{m.l}</div>
              <div className="serif" style={{fontSize:15,color:"var(--g1)"}}>{m.v}</div>

          ))}

      </div>
      <div className="card" style={{padding:20,marginBottom:14}}>
        <div className="label" style={{marginBottom:12,color:"var(--g2)"}}>Configuracoes do plano</div>
        {SETUP_QS.map(q => {
          const ans = setup[q.id] || [];
          return (
            <div key={q.id} style={{marginBottom:12}}>
              <div style={{fontSize:10,color:"var(--ink3)",marginBottom:4}}>{q.q}</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                {ans.length > 0

// \u2500\u2500 APP \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500

function App() {
  const [apiKey, setApiKey]     = useState(LS.get("nutri_key",""));
  const [setup, setSetup]       = useState(LS.get("nutri_setup",{}));
  const [ready, setReady]       = useState(()=>!!LS.get("nutri_key","")&&Object.keys(LS.get("nutri_setup",{})).length>=SETUP_QS.length);
  const [tab, setTab]           = useState("hoje");
  const [planos, setPlanos]     = useState(LS.get("nutri_planos",{}));
  const [bio, setBio]           = useState(LS.get("nutri_bio",[]));
  const [diario, setDiario]     = useState(LS.get("nutri_diario",[]));
  const [banner, setBanner]     = useState(false);

  const TABS = [
    {id:"hoje",     label:"Hoje"},
    {id:"bio",      label:"Bio"},
    {id:"diario",   label:"Diario"},
    {id:"geis",     label:"Geis"},
    {id:"contexto", label:"Contexto"},
    {id:"perfil",   label:"Perfil"},
  ];

  function onComplete(key, ans) { setApiKey(key); setSetup(ans); setReady(true); }

  function onReset() {
    LS.set("nutri_setup",{}); LS.set("nutri_planos",{}); LS.set("nutri_ctx","");
    setSetup({}); setPlanos({}); setReady(false);
  }

  function onInvalidate() {
    setPlanos({}); LS.set("nutri_planos",{});
    LS.set("nutri_bio_analise","");
    setBanner(true);
    setTimeout(()=>setBanner(false),4000);
  }

  if (!ready) return <SetupScreen onComplete={onComplete}/>;

  const latestBio = bio[0] || null;

  return (
    <div style={{background:"var(--bg)",minHeight:"100vh",paddingBottom:68}}>
      <div style={{background:"var(--g1)",color:"#fff",padding:"18px 16px 0",position:"sticky",top:0,zIndex:100}}>
        <div style={{maxWidth:660,margin:"0 auto"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
            <div>
              <div style={{fontSize:8,letterSpacing:3,textTransform:"uppercase",color:"rgba(255,255,255,0.4)",marginBottom:3}}>Nutricao - Berlim 2025</div>
              <div className="serif" style={{fontSize:"clamp(17px,4vw,22px)",color:"#fff",fontStyle:"italic",lineHeight:1}}>Ana Clara</div>
            </div>
            <div style={{textAlign:"right",fontSize:9,color:"rgba(255,255,255,0.4)"}}>
              <div>{(latestBio&&latestBio.peso?latestBio.peso+"kg":"59,1 kg")+" - "+(latestBio&&latestBio.gordura?latestBio.gordura+"% gord":"17,5% gord")}</div>
              <div style={{marginTop:2}}>Sub-4h - set/2025</div>
            </div>
          </div>
          <div style={{display:"flex",gap:0,overflowX:"auto",marginTop:10}}>
            {TABS.map(t => (
              <button key={t.id} onClick={()=>setTab(t.id)} style={{padding:"8px 12px",background:tab===t.id?"var(--bg)":"transparent",color:tab===t.id?"var(--g1)":"rgba(255,255,255,0.55)",border:"none",borderRadius:"7px 7px 0 0",fontFamily:"DM Mono,monospace",fontSize:9,letterSpacing:1,textTransform:"uppercase",cursor:"pointer",whiteSpace:"nowrap",transition:"all .15s"}}>
                {t.label}
              </button>
            ))}
          </div>
        </div>
      </div>

      <div style={{maxWidth:660,margin:"0 auto",padding:"20px 16px 32px"}}>
        {banner && (
          <div style={{background:"var(--a3)",border:"1px solid var(--a2)",borderRadius:8,padding:"10px 14px",marginBottom:16,fontSize:11,color:"var(--a1)"}}>
            Nova medicao salva. Os planos do dia serao regenerados com seus dados atualizados.
          </div>
        )}
        {tab==="hoje"     && <TodayTab    apiKey={apiKey} setup={setup} planos={planos} setPlanos={setPlanos} bioLatest={latestBio}/>}
        {tab==="bio"      && <BioTab      apiKey={apiKey} historico={bio} setHistorico={setBio} onInvalidate={onInvalidate}/>}
        {tab==="diario"   && <DiarioTab   apiKey={apiKey} diario={diario} setDiario={setDiario}/>}
        {tab==="geis"     && <GeisTab/>}
        {tab==="contexto" && <ContextoTab apiKey={apiKey} setup={setup}/>}
        {tab==="perfil"   && <PerfilTab   setup={setup} onReset={onReset}/>}
      </div>

      <div style={{position:"fixed",bottom:0,left:0,right:0,background:"var(--g1)",borderTop:"1px solid rgba(255,255,255,0.08)",display:"flex",zIndex:200}}>
        {TABS.map(t => (
          <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,padding:"10px 4px 12px",background:"transparent",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3,color:tab===t.id?"#fff":"rgba(255,255,255,0.35)",transition:"color .15s"}}>
            <span style={{fontFamily:"DM Mono,monospace",fontSize:7,letterSpacing:.5,textTransform:"uppercase"}}>{t.label}</span>
            {tab===t.id && <div style={{width:4,height:4,background:"var(--g4)",borderRadius:"50%"}}/>}
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
